<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script src="script.js" defer></script>
    <title>Tasks traker</title>
</head>
<body>
    <div class="backgroundContainer"></div>
    <div class="container"></div>
    <container class="mainContainer" id="mainContainer">
        <container class="filterPanel glass" id="filterPanel">
            <div class="titleHeadline">Навыки</div>
            <button class="addFilter" id="addFilter">Добавить фильтр</button>
            <container class="newFilter" id="newFilter">
            </container>
        </container>
        <container class="tasksPanel" id="tasksPanel">
            <div class="titleHeadline">Задачи</div>
            <container class="newTask" id="newTask">
            </container>
            <button class="addTask" id="addTask">Добавить задачу</button>
        </container>
    </container>
</body>
</html>
